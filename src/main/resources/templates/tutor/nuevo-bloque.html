<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Generar turnos - Booktor</title>
</head>
<body>
<h1>Generar turnos</h1>
<p>Se crean turnos seguidos de la duración que tenés configurada, desde la hora inicial hasta la final.</p>

<form action="/tutor/turnos" method="post">
    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
    <p>
        <label for="materiaId">Materia</label>
        <select id="materiaId" name="materiaId" required>
            <option th:each="m : ${materias}" th:value="${m.id}" th:text="${m.nombre}"></option>
        </select>
    </p>
    <p>
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" name="fecha" required>
    </p>
    <p>
        <label for="horaDesde">Desde</label>
        <input type="time" id="horaDesde" name="horaDesde" required>
        <label for="horaHasta">Hasta</label>
        <input type="time" id="horaHasta" name="horaHasta" required>
    </p>
    <p>
        <label for="modalidad">Modalidad</label>
        <select id="modalidad" name="modalidad" required>
            <option value="VIRTUAL">Virtual</option>
            <option value="PRESENCIAL">Presencial</option>
        </select>
    </p>
    <p>
        <label for="link">Link (si es virtual)</label>
        <input type="url" id="link" name="link" maxlength="255">
    </p>
    <p>
        <label for="lugar">Lugar (si es presencial)</label>
        <input type="text" id="lugar" name="lugar" maxlength="255">
    </p>
    <button type="submit">Generar turnos</button>
</form>

<p><a href="/tutor">Volver al menú</a></p>
</body>
</html>
