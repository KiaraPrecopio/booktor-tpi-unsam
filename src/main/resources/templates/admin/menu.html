<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <title>Menú del administrador - Booktor</title>
</head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: barra}"></nav>
<main class="container">
    <h1 class="h3 mb-4">Menú del administrador</h1>
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-lg-4"><a class="card card-body h-100 text-decoration-none fw-semibold" href="/admin/materias">Materias</a></div>
        <div class="col-sm-6 col-lg-4"><a class="card card-body h-100 text-decoration-none fw-semibold" href="/admin/adaptaciones">Adaptaciones</a></div>

        <div class="col-sm-6 col-lg-4"><a class="card card-body h-100 text-decoration-none fw-semibold" href="/admin/tutores">Tutores</a></div>
        <div class="col-sm-6 col-lg-4"><a class="card card-body h-100 text-decoration-none fw-semibold" href="/admin/reservas">Reservas activas</a></div>
    </div>

    <form action="/logout" method="post">
        <button class="btn btn-outline-danger" type="submit">Cerrar sesión</button>
    </form>
</main>
</body>
</html>
