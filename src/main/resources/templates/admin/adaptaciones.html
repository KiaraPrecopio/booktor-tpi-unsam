<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adaptaciones - Booktor</title>
</head>
<body>
<h1>Adaptaciones</h1>
<table border="1">
    <tr><th>Nombre</th><th>Descripción</th><th></th><th></th></tr>
    <tr th:each="x : ${adaptaciones}">
        <td th:text="${x.nombre}"></td>
        <td th:text="${x.descripcion}"></td>
        <td><form action="/admin/adaptaciones/editar" method="get">
            <input type="hidden" name="id" th:value="${x.id}">
            <button type="submit">Editar</button>
        </form></td>
        <td><form action="/admin/adaptaciones/baja" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <input type="hidden" name="id" th:value="${x.id}">
            <button type="submit">Dar de baja</button>
        </form></td>
    </tr>
</table>

<h2>Nueva adaptación</h2>
<form action="/admin/adaptaciones" method="post">
    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
    <p>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" maxlength="100" required>
    </p>
    <p>
        <label for="descripcion">Descripción</label>
        <input type="text" id="descripcion" name="descripcion" maxlength="255">
    </p>
    <button type="submit">Dar de alta</button>
</form>

<p><a href="/admin">Volver al menú</a></p>
</body>
</html>
