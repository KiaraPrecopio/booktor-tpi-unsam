<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <title>Tutores - Booktor</title>
</head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: barra}"></nav>
<main class="container">
    <nav aria-label="Ubicación">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/admin">Inicio</a></li>
            <li class="breadcrumb-item active" aria-current="page">Tutores</li>
        </ol>
    </nav>
    <h1 class="h3 mb-4">Tutores</h1>
    <div class="table-responsive mb-4">
        <table class="table table-hover align-middle bg-white border">
            <thead class="table-light">
                <tr><th>Nombre</th><th>Email</th><th>Duración</th><th>Adaptaciones</th><th></th><th></th></tr>
            </thead>
            <tbody>
                <tr th:each="x : ${tutores}">
                    <td th:text="${x.nombre + ' ' + x.apellido}"></td>
                    <td th:text="${x.email}"></td>
                    <td th:text="${x.duracionTurnoMinutos + ' min'}"></td>
                    <td><span th:each="a : ${x.adaptaciones}" th:text="${a.nombre + '. '}"></span></td>
                    <td><form action="/admin/tutores/editar" method="get">
                        <input type="hidden" name="id" th:value="${x.id}">
                        <button class="btn btn-sm btn-outline-primary" type="submit">Editar</button>
                    </form></td>
                    <td><form action="/admin/tutores/baja" method="post">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                        <input type="hidden" name="id" th:value="${x.id}">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Dar de baja</button>
                    </form></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h2 class="h5 card-title">Nuevo tutor</h2>
            <form action="/admin/tutores" method="post">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label" for="nombre">Nombre</label>
                        <input class="form-control" type="text" id="nombre" name="nombre" maxlength="100" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="apellido">Apellido</label>
                        <input class="form-control" type="text" id="apellido" name="apellido" maxlength="100" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" type="email" id="email" name="email" maxlength="150" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="password">Contraseña</label>
                        <input class="form-control" type="password" id="password" name="password" minlength="8" maxlength="72" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="duracionTurnoMinutos">Duración del turno (minutos)</label>
                        <input class="form-control" type="number" id="duracionTurnoMinutos" name="duracionTurnoMinutos" min="1" required>
                    </div>
                </div>
                <p class="form-label mb-2">Adaptaciones que ofrece (al menos una):</p>
                <div class="form-check" th:each="a : ${adaptaciones}">
                    <input class="form-check-input" type="checkbox" th:id="${'adaptacion' + a.id}" name="adaptacionIds" th:value="${a.id}">
                    <label class="form-check-label" th:for="${'adaptacion' + a.id}" th:text="${a.nombre}"></label>
                </div>
                <button class="btn btn-primary mt-3" type="submit">Dar de alta</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
