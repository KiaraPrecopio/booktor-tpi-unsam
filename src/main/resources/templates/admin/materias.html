<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <title>Materias - Booktor</title>
</head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: barra}"></nav>
<main class="container">
    <nav aria-label="Ubicación">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/admin">Inicio</a></li>
            <li class="breadcrumb-item active" aria-current="page">Materias</li>
        </ol>
    </nav>
    <h1 class="h3 mb-4">Materias</h1>
    <div class="table-responsive mb-4">
        <table class="table table-hover align-middle bg-white border">
            <thead class="table-light">
                <tr><th>Nombre</th><th>Descripción</th><th></th><th></th></tr>
            </thead>
            <tbody>
                <tr th:each="x : ${materias}">
                    <td th:text="${x.nombre}"></td>
                    <td th:text="${x.descripcion}"></td>
                    <td><form action="/admin/materias/editar" method="get">
                        <input type="hidden" name="id" th:value="${x.id}">
                        <button class="btn btn-sm btn-outline-primary" type="submit">Editar</button>
                    </form></td>
                    <td><form action="/admin/materias/baja" method="post">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                        <input type="hidden" name="id" th:value="${x.id}">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Dar de baja</button>
                    </form></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h2 class="h5 card-title">Nueva materia</h2>
            <form action="/admin/materias" method="post">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input class="form-control" type="text" id="nombre" name="nombre" maxlength="100" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="descripcion">Descripción</label>
                    <input class="form-control" type="text" id="descripcion" name="descripcion" maxlength="255">
                </div>
                <button class="btn btn-primary" type="submit">Dar de alta</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
