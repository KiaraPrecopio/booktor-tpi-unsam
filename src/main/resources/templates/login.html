<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <title>Iniciar sesión - Booktor</title>
</head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: barra}"></nav>
<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">Iniciar sesión</h1>

                    <div class="alert alert-danger" role="alert" th:if="${param.error}">Email o contraseña incorrectos.</div>
                    <div class="alert alert-success" role="alert" th:if="${param.logout}">Cerraste la sesión.</div>

                    <form action="/login" method="post">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input class="form-control" type="email" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Contraseña</label>
                            <input class="form-control" type="password" id="password" name="password" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
