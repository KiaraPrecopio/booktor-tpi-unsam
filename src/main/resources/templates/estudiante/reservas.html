<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <title>Mis reservas - Booktor</title>
</head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: barra}"></nav>
<main class="container">
    <nav aria-label="Ubicación">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/estudiante">Inicio</a></li>
            <li class="breadcrumb-item active" aria-current="page">Mis reservas</li>
        </ol>
    </nav>
    <h1 class="h3 mb-4">Mis reservas</h1>
    <div class="alert alert-info" th:if="${reservas.isEmpty()}">No tenés reservas próximas.</div>

    <div class="table-responsive mb-4" th:if="${!reservas.isEmpty()}">
        <table class="table table-hover align-middle bg-white border">
            <thead class="table-light">
                <tr><th>Materia</th><th>Tutor</th><th>Inicio</th><th>Fin</th><th>Modalidad</th><th>Link o lugar</th><th>Objetivo</th><th></th></tr>
            </thead>
            <tbody>
                <tr th:each="r : ${reservas}">
                    <td th:text="${r.materia}"></td>
                    <td th:text="${r.tutor}"></td>
                    <td th:text="${#temporals.format(r.inicio, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${#temporals.format(r.fin, 'HH:mm')}"></td>
                    <td><span class="badge text-bg-secondary" th:text="${r.modalidad}"></span></td>
                    <td><span th:text="${r.link}"></span><span th:text="${r.lugar}"></span></td>
                    <td th:text="${r.objetivo}"></td>
                    <td><form action="/estudiante/reservas/cancelar" method="post">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                        <input type="hidden" name="reservaId" th:value="${r.id}">
                        <button class="btn btn-sm btn-outline-danger text-nowrap" type="submit">Cancelar reserva</button>
                    </form></td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
