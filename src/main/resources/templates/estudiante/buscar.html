<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Buscar tutoría - Booktor</title>
</head>
<body>
<h1>Buscar tutoría</h1>
<form action="/estudiante/buscar" method="get">
    <label for="nombre">Materia</label>
    <input type="text" id="nombre" name="nombre" th:value="${nombre}">
    <button type="submit">Buscar</button>
</form>

<p th:if="${materias.isEmpty()}">No hay materias con turnos disponibles.</p>

<table border="1" th:if="${!materias.isEmpty()}">
    <tr><th>Materia</th><th>Descripción</th><th></th></tr>
    <tr th:each="m : ${materias}">
        <td th:text="${m.nombre}"></td>
        <td th:text="${m.descripcion}"></td>
        <td><form action="/estudiante/tutores" method="get">
            <input type="hidden" name="materiaId" th:value="${m.id}">
            <button type="submit">Ver tutores</button>
        </form></td>
    </tr>
</table>

<p><a href="/estudiante">Volver al menú</a></p>
</body>
</html>
